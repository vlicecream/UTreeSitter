[package]
name = "tree-sitter-unreal-cpp"
description = "Unreal C++ tree-sitter parser"
version = "0.1.0"
authors = ["Ame林汀 <vlicecream@163.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "unreal-cpp"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/vlicecream/utreesitter"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
